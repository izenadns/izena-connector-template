name: release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'

permissions: {}

env:
  CI: true
  GOWORK: "off"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: create release from merged metadata
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'release-please--branches--main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - &checkout
        name: check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &verify-source
        name: require successful main ci for release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          source_sha="$(git log --first-parent -1 --format=%H HEAD -- . \
            ':(exclude)CHANGELOG.md' ':(exclude)release-please-manifest.json')"
          test -n "$source_sha"
          while read -r candidate; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --commit "$candidate" --status success \
              --limit 1 --json databaseId --jq 'length')"
            if [ "$runs" -eq 1 ]; then
              exit 0
            fi
            if [ "$candidate" = "$source_sha" ]; then
              break
            fi
          done < <(git rev-list --first-parent HEAD)
          echo "Release source has no successful main CI run" >&2
          exit 1
      - name: create release and tag
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json
          skip-github-pull-request: true

  publish:
    name: publish versioned artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - *checkout
      - name: verify semver tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag is not a SemVer release: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - *verify-source
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: check go toolchain
        run: make bootstrap
      - name: package tagged artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          make release-artifacts
          artifact="$(make --no-print-directory artifact-path)"
          test -f "$artifact"
          printf 'wasm=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
      - name: attest release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            ${{ steps.artifacts.outputs.wasm }}
      - name: attach release artifacts
        env:
          WASM_ARTIFACT: ${{ steps.artifacts.outputs.wasm }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          for artifact in dist/*.tar.gz "$WASM_ARTIFACT" dist/*.sbom.json; do
            test -s "$artifact.sha256"
            assets+=("$artifact" "$artifact.sha256")
          done
          for attempt in {1..12}; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                "${assets[@]}" --clobber
              exit 0
            fi
            sleep 5
          done
          echo "Release Please did not create a release for $GITHUB_REF_NAME" >&2
          exit 1
